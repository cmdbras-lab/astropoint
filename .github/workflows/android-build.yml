name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/astropointer-v0.1-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astropointer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/v02.js
          node --check app/src/main/assets/www/v021.js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle --no-daemon clean assembleDebug

      - name: Preparar artefacto
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AstroPointer-v0.2.1-debug.apk
          sha256sum release/AstroPointer-v0.2.1-debug.apk > release/AstroPointer-v0.2.1-debug.sha256
          ls -lh release/

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AstroPointer-v0.2.1-debug-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30
